<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <title>Festivite</title>
</head>
<body>
  <div class="pg">
    <aside>
      <div class="container-aside">
        <img src="assets/Background.png" alt="Foto de um bolo colorido com uma vela de aniversário em cima" srcset="">
        <div class="info-aside">
          <img src="assets/Logo.svg" alt="Logo do Festivite" srcset="">
          <h2>Festivite</h2>
          <p>Crie um convite digital para o seu evento</p>
        </div>
      </div>
    </aside>
    <main>
      <div class="container-main">
        <h1>Crie seu convite</h1>
        <form>
          <fieldset>
            <div class="legend-wrapper">
              <img src="assets/calendar.svg" alt="ícone calendário" srcset="">
              <legend>Sobre o evento</legend>
            </div>
            <div class="input-wrapper">
              <label for="event-name">Título do evento</label>
              <input type="text" name="event-name" id="event-name" placeholder="Nome do evento">
            </div>
          </fieldset>
        </form>
        
      </div>
    </main>
  </div>
  
</body>
</html>
